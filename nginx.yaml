apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
  - port: 80


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  selector:
    matchLabels:
      app: nginx # which pod to manage
  replicas: 3 # desired number of pods

  # template for the pod - kind is not needed here 
  template:
    metadata:
      labels:
        app: nginx # same as selector above - label for the pod
    spec:
      containers: # this is a sequence (list)
      - name: nginx # one item of the list (a mapping/object)
        image: nginx # fields inside the mapping: no dash
        resources: # nested mapping
          limits:
            memory: "128Mi"
            cpu: "250m"
          requests:
            memory: "64Mi"    # steady expected memory
            cpu: "100m"  
        ports: # ports can be a list too
        - containerPort: 80 # each port is an item in the ports list
