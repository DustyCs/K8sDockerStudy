name: CI Pipeline

on:
  push:
    branches:
      - initialization

jobs:
  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run fake tests
        run: |
          echo "Running tests..."
          echo "All tests passed! :3"

  build_image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: run_tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # set name
      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./k8s-web-to-nginx
          push: true
          tags: dustycs/k8s-web-to-nginx:${{ env.SHORT_SHA }}
        
      - name: Update manifest in GitLab repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # clone your GitLab repo
          git clone https://${{ env.GITLAB_USER }}:${{ secrets.GITLAB_TOKEN }}@gitlab.com/dustycs-inc/dustycs-web-nginx-k8s-argo.git
          cd dustycs-web-nginx-k8s-argo

          # update image tag (assuming you have the file path below)
          sed -i "s#dustycs/k8s-web-to-nginx:.*#dustycs/k8s-web-to-nginx:${{ env.SHORT_SHA }}#g" deployment.yaml

          git add deployment.yaml
          git commit -m "Update image tag to ${{ env.SHORT_SHA }}"
          git push origin main

